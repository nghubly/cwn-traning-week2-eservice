# รัน: TEST_MODE=1 docker compose up --build
#      TEST_MODE=1 BUG_MODE=B03 docker compose up --build   (เปิดบั๊กตาม BUGS.md · คั่นหลายตัวด้วย ,)
# ไม่ตั้ง TEST_MODE → /api/test/* ตอบ 404 · ไม่ตั้ง BUG_MODE → เว็บถูกต้อง 100%
# ฐานข้อมูลอยู่ที่ ./data/egov.db บนเครื่อง host (DB_PATH ในคอนเทนเนอร์ = /data/egov.db) ใช้ตรวจ TC-NFR-04
services:
  web:
    build: .
    image: egov-eservice:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      TZ: Asia/Bangkok
      TEST_MODE: "${TEST_MODE:-}"
      BUG_MODE: "${BUG_MODE:-}"
      DB_PATH: /data/egov.db
      UPLOAD_DIR: /data/uploads
      BASE_URL: "${BASE_URL:-http://localhost:3000}"
      # คีย์ทดสอบเท่านั้น (ข้อมูลสมมติ) · ห้ามใช้ในระบบจริง
      PII_KEY: "${PII_KEY:-egov-test-pii-key-not-for-production}"
      DOC_HMAC_KEY: "${DOC_HMAC_KEY:-egov-test-doc-hmac-key-not-for-production}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
